<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A1: Hello World, GitHub and d3</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div id="container"></div>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script>
    console.log("d3 version", d3.version); // test that d3 loaded
    // Declare the chart dimensions and margins.
    const width = 640;
    const height = 400;
    const marginTop = 20;
    const marginRight = 20;
    const marginBottom = 30;
    const marginLeft = 40;

    // Declare the x (horizontal position) scale.
    const x = d3.scaleUtc()
        .domain([marginLeft, width - marginRight])
        .range([marginLeft, width - marginRight]);

    // Declare the y (vertical position) scale.
    const y = d3.scaleLinear()
        .domain([height - marginBottom, marginTop])
        .range([height - marginBottom, marginTop]);

    // Create the SVG container.
    const svg = d3.create("svg")
        .attr("width", width)
        .attr("height", height);

    // Add the x-axis.
    svg.append("g")
        .attr("transform", `translate(0,${height - marginBottom})`)
        .call(d3.axisBottom(x));

    // Add the y-axis.
    svg.append("g")
        .attr("transform", `translate(${marginLeft},0)`)
        .call(d3.axisLeft(y));

    //functions to make it so that shapes move when hovered over
    var mouseover = function(d) {
      d3.select(this)
        .classed("moving", true)
    }

    var mouseout = function(d) {
      d3.select(this)
        .classed("moving", false)
    }

    var click = function(d) {
      d3.select(this)
        .classed("gravity", !d3.select(this).classed("gravity"))
    }

    //circle element!
    svg.append("circle")
        .attr("cx", 90)
        .attr("cy", 120)
        .attr("r", 20)
        .attr("fill", "#7EFFC0")
        .attr("stroke", "#3e8060") //same color, just darkened
        .attr("stroke-dasharray", "4 2") 
        .attr("stroke-width", 2)
        .on("mouseover", mouseover)
        .on("mouseout", mouseout)
        .on("click", click)
        .style("--fall", `${height - marginBottom - (120 + 20)}px`); //css style for gravity

    //rectangle element!
    svg.append("rect")
        .attr("x", 160)
        .attr("y", marginTop + 10)
        .attr("width", 70)
        .attr("height", 20)
        .attr("fill", "#FFA37D")
        .on("mouseover", mouseover)
        .on("mouseout", mouseout)
        .on("click", click)
        .style("--fall", `${height - marginBottom - (marginTop + 10 + 20)}px`); //css style for gravity

    //line element!
    svg.append("line")
        .attr("x1", 300)
        .attr("y1", 220)
        .attr("x2", 330)
        .attr("y2", 240)
        .attr("stroke", "#678074")
        .attr("stroke-width", 4)
        .on("mouseover", mouseover)
        .on("mouseout", mouseout)
        .on("click", click)
        .style("--fall", `${height - marginBottom - (240 + 2)}px`); //css style for gravity

    //polygon element!
    svg.append("polygon")
        .attr("points", "500,150 550,100 575,150 550,200 525,180")
        .attr("fill", "#FF7D95")
        .on("mouseover", mouseover)
        .on("mouseout", mouseout)
        .on("click", click)
        .style("--fall", `${height - marginBottom - 200}px`); //css style for gravity

    // Append the SVG element.
    container.append(svg.node());

    // smiley face time! going to be an image underneath the graph
    // Declare the x (horizontal position) scale.
    const x2 = d3.scaleUtc()
        .domain([marginLeft, width - marginRight])
        .range([marginLeft, width - marginRight]);

    // Declare the y (vertical position) scale.
    const y2 = d3.scaleLinear()
        .domain([height - marginBottom, marginTop])
        .range([height - marginBottom, marginTop]);

    // Create the SVG container.
    const svg2 = d3.create("svg")
        .attr("width", width)
        .attr("height", height);

    //right eyebrow
    svg2.append("rect")
        .attr("x", 65)
        .attr("y", 80)
        .attr("width", 50)
        .attr("height", 10)
        .attr("fill", "#FFA37D")
        .on("mouseover", mouseover)
        .on("mouseout", mouseout)
        .on("click", click)
        .style("--fall", `${height - marginBottom - (80 + 10)}px`);

    //left eyebrow
    svg2.append("rect")
        .attr("x", 175)
        .attr("y", 80)
        .attr("width", 50)
        .attr("height", 10)
        .attr("fill", "#FFA37D")
        .on("mouseover", mouseover)
        .on("mouseout", mouseout)
        .on("click", click)
        .style("--fall", `${height - marginBottom - (80 + 10)}px`);

    //right eye
    svg2.append("circle")
        .attr("cx", 90)
        .attr("cy", 120)
        .attr("r", 20)
        .attr("fill", "#7EFFC0")
        .attr("stroke", "#3e8060") //same color, just darkened
        .attr("stroke-dasharray", "4 2") 
        .attr("stroke-width", 2)
        .on("mouseover", mouseover)
        .on("mouseout", mouseout)
        .on("click", click)
        .style("--fall", `${height - marginBottom - (120 + 20)}px`);

    //left eye
    svg2.append("circle")
        .attr("cx", 200)
        .attr("cy", 120)
        .attr("r", 20)
        .attr("fill", "#7EFFC0")
        .attr("stroke", "#3e8060") //same color, just darkened
        .attr("stroke-dasharray", "4 2") 
        .attr("stroke-width", 2)
        .on("mouseover", mouseover)
        .on("mouseout", mouseout)
        .on("click", click)
        .style("--fall", `${height - marginBottom - (120 + 20)}px`);

    //nose
    svg2.append("polygon")
        .attr("points", "145,150 160,190 130,190")
        .attr("fill", "#FF7D95")
        .on("mouseover", mouseover)
        .on("mouseout", mouseout)
        .on("click", click)
        .style("--fall", `${height - marginBottom - 190}px`);

    //mouth, split into three parts
    svg2.append("line")
        .attr("x1", 70)
        .attr("y1", 200)
        .attr("x2", 110)
        .attr("y2", 240)
        .attr("stroke", "#678074")
        .attr("stroke-width", 4)
        .on("mouseover", mouseover)
        .on("mouseout", mouseout)
        .on("click", click)
        .style("--fall", `${height - marginBottom - (240 + 2)}px`);

    svg2.append("line")
        .attr("x1", 110)
        .attr("y1", 240)
        .attr("x2", 180)
        .attr("y2", 240)
        .attr("stroke", "#678074")
        .attr("stroke-width", 4)
        .on("mouseover", mouseover)
        .on("mouseout", mouseout)
        .on("click", click)
        .style("--fall", `${height - marginBottom - (240 + 2)}px`);

    svg2.append("line")
        .attr("x1", 180)
        .attr("y1", 240)
        .attr("x2", 220)
        .attr("y2", 200)
        .attr("stroke", "#678074")
        .attr("stroke-width", 4)
        .on("mouseover", mouseover)
        .on("mouseout", mouseout)
        .on("click", click)
        .style("--fall", `${height - marginBottom - (240 + 2)}px`);

    // the ground, so that gravity makes a little bit of sense
    svg2.append("line")
        .attr("x1", 40)
        .attr("y1", height - marginBottom)
        .attr("x2", 260)
        .attr("y2", height - marginBottom)
        .attr("stroke", "#678074")
        .attr("stroke-width", 1)


    // Append the SVG element.
    container.append(svg2.node());

  </script>
</body>
</html>
